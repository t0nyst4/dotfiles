[manager]
ratio = [1, 4, 3]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "none"
show_hidden = false
show_symlink = true

[preview]
image_filter = "lanczos3"
image_quality = 90
max_width = 1000
max_height = 1000
cache_dir = "/tmp/yazi-cache"
ueberzug_scale = 1

[image]
backend = "kitty"
ueberzug_offset = [0, 0, 0, 0]

[opener]
edit = [
	{ run = 'nvim "$@"', block = true, desc = "Neovim", for = "linux" },
]
open = [
	{ run = 'xdg-open "$@"', block = true, desc = "Open", for = "linux" },
]
reveal = [
	{ run = 'xdg-open "$(dirname "$1")"', block = true, desc = "Reveal", for = "linux" },
]

[open]
rules = [
	{ url = "*/", use = ["edit"] },
	{ url = "*", use = ["edit"] },
]

[plugin]
prepend_previewers = [
	{ url = "*.md", run = "piper -- mdcat --columns=$w $1" },
	{ url = "*.markdown", run = "piper -- mdcat --columns=$w $1" },
]
