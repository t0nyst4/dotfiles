# ==========================================
#  ~/.tmux.conf - tmux (Catppuccin Mocha)
# ==========================================

# ---------- 基础 ----------

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g default-terminal 'tmux-256color'
set -ga terminal-overrides ',*256col*:Tc'
set -g allow-passthrough all
set -g terminal-features ",xterm-ghostty:clipboard:ccolour:cstyle:focus:title:mouse:osc7:RGB:usstyle"
set -g set-clipboard on
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g history-limit 50000
set -sg escape-time 0
setw -g automatic-rename on
set -g automatic-rename-format '#{pane_current_command}'

# ---------- 插件 (TPM) ----------

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'MunifTanjim/tmux-mode-indicator'

# 导航与效率插件
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'

# tmux-floax: 浮动窗格 (Leader + f 切换)
set -g @floax-bind 'f'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'blue'
set -g @floax-text-color 'white'
set -g @floax-change-path 'true'


# tmux-resurrect: 会话保存恢复
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

# tmux-continuum: 自动保存与恢复
set -g @continuum-restore 'on'

# tmux-yank: 复制模式增强
set -g @yank_with_mouse on
set -g @yank_selection_mouse 'clipboard'

# tmux-fzf: 模糊搜索

# ---------- Catppuccin Mocha ----------

thm_bg='#1e1e2e'
thm_fg='#cdd6f4'
thm_black='#181825'
thm_magenta='#cba6f7'
thm_pink='#f5c2e7'
thm_red='#f38ba8'
thm_green='#a6e3a1'
thm_yellow='#f9e2af'
thm_blue='#89b4fa'
thm_orange='#fab387'
thm_surface0='#313244'
thm_surface1='#45475a'
thm_surface2='#585b70'

# ---------- 状态栏 ----------

set -g status-style "bg=$thm_bg,fg=$thm_fg"
set -g status-justify 'left'
set -g status-interval 5

set -g status-left-length 50
set -g status-left "#[fg=$thm_bg,bg=$thm_blue,bold]  #S #[fg=$thm_fg,bg=$thm_surface0] #I:#P #[fg=$thm_surface0,bg=$thm_bg]"

# 模式指示器（使用插件）
set -g status-right-length 120
set -g status-right "#[fg=$thm_fg,bg=$thm_surface0] |-:split xX:close c:new ,:rename e:layout f:float ?:help r:reload #[fg=$thm_surface0,bg=$thm_bg]#[fg=$thm_bg,bg=$thm_orange] %H:%M #{tmux_mode_indicator}"

setw -g window-status-format "#[fg=$thm_fg,bg=$thm_bg] #I:#W "
setw -g window-status-current-format "#[fg=$thm_bg,bg=$thm_magenta,bold] #I:#W #[fg=$thm_magenta,bg=$thm_bg]"
setw -g window-status-separator ''

set -g pane-border-style "fg=$thm_surface1"
set -g pane-active-border-style "fg=$thm_blue"
set -g pane-border-lines single

set -g message-style "bg=$thm_surface0,fg=$thm_fg"
set -g message-command-style "bg=$thm_surface0,fg=$thm_fg"
setw -g mode-style "bg=$thm_surface1,fg=$thm_fg"
setw -g clock-mode-colour "$thm_blue"

# ---------- Pane 移动 (Alt+hjkl) ----------

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# ---------- Pane 调整大小 (Alt+方向键) ----------

bind -n M-Left resize-pane -L 3
bind -n M-Down resize-pane -D 3
bind -n M-Up resize-pane -U 3
bind -n M-Right resize-pane -R 3

# ---------- Window 移动 (Alt+,.) ----------

bind -n M-, previous-window
bind -n M-. next-window

# ---------- 分割/新建 (继承 CWD) ----------

bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'

# ---------- 关闭/重命名 ----------

bind x confirm-before -p 'kill pane? (y/n)' kill-pane
bind X confirm-before -p 'kill window? (y/n)' kill-window
bind , command-prompt -I '#W' 'rename-window "%%"'

# ---------- 三窗格布局 (Leader + e) ----------

bind e new-window -c '#{pane_current_path}' \; \
    send-keys 'claude agents' Enter \; \
    split-window -h -l 60% -c '#{pane_current_path}' \; \
    send-keys 'yazi' Enter \; \
    split-window -v -l 50% -c '#{pane_current_path}' \; \
    send-keys 'lazygit' Enter \; \
    select-pane -t 1

# ---------- 快速重载 ----------

bind r source-file ~/.tmux.conf \; display-message 'Config reloaded!'

# ---------- 帮助 ----------

bind ? list-keys -N

# ---------- 禁用 bracketed paste ----------

set -g assume-paste-time 0

# ---------- 复制模式（tmux-yank 插件自动处理剪贴板） ----------

setw -g mode-keys vi

# ---------- 初始化 TPM ----------

run '~/.tmux/plugins/tpm/tpm'

